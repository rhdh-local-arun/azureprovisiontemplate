name: 'Terraform Destroy'

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "destroy" to confirm'
        required: true
        type: string

env:
  TF_VERSION: '1.5.7'

permissions:
  contents: read

jobs:
  destroy:
    name: 'Destroy Infrastructure'
    runs-on: ubuntu-latest
    # Optional: Uncomment to require approval before destroy
    # You must create the environment in GitHub Settings first
    # environment: ${{ values.environment }}-destroy

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Validate Confirmation
        run: |
          if [ "{% raw %}${{ github.event.inputs.confirm_destroy }}{% endraw %}" != "destroy" ]; then
            echo "❌ Confirmation failed. You must type 'destroy' to proceed."
            exit 1
          fi
          echo "✅ Confirmation validated"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: {% raw %}${{ env.TF_VERSION }}{% endraw %}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: {% raw %}${{ secrets.AZURE_CREDENTIALS }}{% endraw %}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=tfstate-rg" \
            -backend-config="storage_account_name=tfstate{% raw %}${{ github.event.repository.name }}{% endraw %}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ values.name }}-${{ values.environment }}.tfstate"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false
        env:
          ARM_CLIENT_ID: {% raw %}${{ secrets.AZURE_CLIENT_ID }}{% endraw %}
          ARM_CLIENT_SECRET: {% raw %}${{ secrets.AZURE_CLIENT_SECRET }}{% endraw %}
          ARM_SUBSCRIPTION_ID: {% raw %}${{ secrets.AZURE_SUBSCRIPTION_ID }}{% endraw %}
          ARM_TENANT_ID: {% raw %}${{ secrets.AZURE_TENANT_ID }}{% endraw %}

      - name: Summary
        run: |
          echo "## 🗑️ Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All resources have been successfully destroyed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Destroyed by:** @{% raw %}${{ github.actor }}{% endraw %}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** {% raw %}${{ github.event.repository.updated_at }}{% endraw %}" >> $GITHUB_STEP_SUMMARY
